name: ai-document-chat

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aidoc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_document}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
  REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
  REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
  REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
  STORAGE_ROOT: /data/uploads
  # AI: both chat + embeddings follow AI_PROVIDER. Vectors always 1536-dim;
  # switching providers requires re-processing documents.
  AI_PROVIDER: ${AI_PROVIDER:-openai}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-models/gemini-embedding-001}
  GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-flash-lite-latest}
  CHUNK_SIZE: ${CHUNK_SIZE:-1000}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
  RAG_TOP_K: ${RAG_TOP_K:-5}
  JOB_STALE_MINUTES: ${JOB_STALE_MINUTES:-30}
  JOB_PENDING_REENQUEUE_MINUTES: ${JOB_PENDING_REENQUEUE_MINUTES:-5}
  JOB_PENDING_FAIL_MINUTES: ${JOB_PENDING_FAIL_MINUTES:-120}
  JOB_REAPER_INTERVAL_SECONDS: ${JOB_REAPER_INTERVAL_SECONDS:-60}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-600}
  CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-720}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
  RATE_LIMIT_CHAT_PER_MINUTE: ${RATE_LIMIT_CHAT_PER_MINUTE:-30}
  RATE_LIMIT_UPLOAD_PER_MINUTE: ${RATE_LIMIT_UPLOAD_PER_MINUTE:-10}
  RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379/2}
  # true when Compose web/nginx (or another proxy) sits in front of the API
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aidoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_document}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:5435:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ai-document-chat-api:${IMAGE_TAG:-latest}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ai-document-chat-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *api-env
    volumes:
      - api_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:8081:8000"

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ai-document-chat-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command:
      - celery
      - -A
      - workers.celery_app.celery_app
      - worker
      - --loglevel=INFO
      - --queues=document_processing
      - --concurrency=${CELERY_CONCURRENCY:-2}
      - --hostname=worker@%h
    env_file:
      - .env
    environment:
      <<: *api-env
    volumes:
      - api_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A workers.celery_app.celery_app inspect ping -d worker@$$HOSTNAME -t 5 | grep -q pong",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  beat:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ai-document-chat-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command:
      - celery
      - -A
      - workers.celery_app.celery_app
      - beat
      - --loglevel=INFO
    env_file:
      - .env
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: ai-document-chat-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-80}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/nginx-health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  api_uploads:
