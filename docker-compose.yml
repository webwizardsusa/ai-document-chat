name: ai-document-chat

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aidoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_document}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:5435:5432"

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ai-document-chat-api:${IMAGE_TAG:-latest}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aidoc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_document}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_ROOT: /data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ai-document-chat-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aidoc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_document}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_ROOT: /data/uploads
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      - api_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      # - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: ai-document-chat-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # Bind localhost only by default (not 0.0.0.0). Override WEB_BIND_HOST if needed.
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-80}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/nginx-health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  api_uploads:
